<div class="signup-container">
    <div class="image-section">
    
    <img src="https://img.magnific.com/free-photo/cheerful-model-sitting-floor-wearing-modern-oversize-black-jacket-creamy-long-dress-high-heel-shoes-her-feet-curly-hairstyle-makeup_343629-61.jpg?semt=ais_hybrid&w=740&q=80" alt="ELEGANCE Fashion Banner">
  </div>
  <div class="form-section">
    <div class="form-container">
    <h1 class="logo">ELEGANCE</h1>
      <h2 class="form-title">Create an ELEGANCE Account</h2>
    <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        <div class="input">
            <label for="first-name">First Name:</label>
            <input type="text" id="first-name" formControlName="firstName" required>
        </div>
        <div class="input">
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" formControlName="lastName" required>
        </div>
        <div class="input">
            <label for="email">Email:</label>
            <input type="email" id="email" formControlName="email" required>
            @if (signUpForm.get('email')?.hasError('emailInUse')) {
            <small class="error-text" style="color: #FB6376; font-size: 12px; margin-top: 4px; display: block;">
            This email is already registered. <a routerLink="/login" style="color: #5D2A42; text-decoration: underline;">Log in?</a>
            </small>
        }
        </div>
        <div class="input">
            <label for="username">Username:</label>
            <input type="text" id="username" formControlName="username" required>
        </div>

        <div class="input">
            <label for="password">Password:</label>
            <input type="password" id="password" formControlName="password" required>
        </div>

        <div class="input">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="confirmPassword" id="confirmPassword" formControlName="confirmPassword" required>
            @if (signUpForm.hasError('passwordMismatch') && signUpForm.get('confirmPassword')?.touched) {
                <small class="error-text">Passwords do not match.</small>
            }
        </div>

        <button type="submit" [disabled]="signUpForm.invalid" class="btn btn-primary">Sign Up</button>
        <p>Already have an account? <a routerLink="/login" class="btn-secondary">Log in</a></p>
        
    </form>
    </div>
    </div>
    </div>
