<!-- Adding stopPropagation to the main container prevents the card click -->
<div class="add-to-cart-container" (click)="$event.stopPropagation()">
  <div class="quantity-controls">
    <button type="button" class="qty-btn" (click)="updateQuantity(-1); $event.stopPropagation()">-</button>
    <span class="qty-number">{{ quantity() }}</span>
    <button type="button" class="qty-btn" (click)="updateQuantity(1); $event.stopPropagation()">+</button>
  </div>

  <button type="button" class="add-cart-btn" (click)="onAddToCart(); $event.stopPropagation()">
    ADD TO CART
  </button>
</div>
