name: Build and Push Docker Image

on:
  push:
    branches:
      - dockerization 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3 #this is what authenticates the ci to dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6 #this is what builds the image and pushes it to dockerhub
        with:
          context: .
          file: ./Dockerfilegit add .github/workflows/docker-build-push.yml
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/academy-frontend:latest #this determines the image name